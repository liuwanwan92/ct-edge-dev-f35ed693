# A prometheus.yml still carrying the shipped example placeholder target --
# used to exercise the "mismatch" and render-contract paths.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'nexentaedge'
    static_configs:
      - targets: ['172.20.1.20:8881']
